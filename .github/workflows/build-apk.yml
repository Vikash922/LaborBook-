name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1 || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "Expected APK $EXPECTED_APK missing or empty."
            echo "Searching for generated APKs:"
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "Verified APK exists: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          SAFE_REPO_NAME=$(basename "${{ github.repository }}" | sed -e 's/[^a-zA-Z0-9-]/_/g')
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "LaborBook v1.0.0 Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Custom LaborBook Debug APK built by GitHub Actions."

      - name: Summary
        run: |
          echo "### 🚀 APK Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
